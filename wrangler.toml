# Rakib Web Studio — Cloudflare Worker + static assets deployment.
# The site is a static Next.js export (`npm run build` writes ./out);
# worker.js fronts it to run the newsletter API (subscribe / unsubscribe
# / send-latest) and legacy redirects. Everything else falls through to
# the static assets.
name = "rakibwebstudio"
main = "worker.js"
compatibility_date = "2025-04-01"

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Without this, Cloudflare serves static assets directly WITHOUT running
# worker.js, so the HSTS header set in the Worker never reaches pages.
# run_worker_first makes every request pass through the Worker (which
# falls through to ASSETS), so security headers apply to all responses.
run_worker_first = true
